# nginx + php-fpm 部署（install.sh --mode=fpm 会安装到 /etc/nginx/sites-available/hysteria-auth）
#
# Hysteria 的 /auth 是**成批短请求**：并发不低但每条都很轻，php-fpm 池子给够即可。
# Cloudflare / 隧道回源时必须让应用看到真实 IP —— 这里传 X-Forwarded-For，
# 同时在 .env 配 TRUSTED_PROXIES=127.0.0.1,::1（否则审计里的 IP 全是回源地址）。
server {
    listen 127.0.0.1:8000;
    server_name _;

    root /opt/hysteria-auth-service/public;
    index index.php;

    client_max_body_size 4m;

    # /auth 不写访问日志（Hysteria 调用极频繁，会淹掉日志）
    location = /auth {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /health {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 30s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
